stages:
  - lint
  - image

default:
  interruptible: true

lint:
  stage: lint
  image: nexus3.sr/go:latest-bookworm-dev-env-linux-amd64
  tags:
    - docker-cicd
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  cache:
    key: go-1.24
    paths:
      - .cache/go-build/
      - .cache/go-mod/
  script:
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - go test -race ./...
    # 框架守卫：契约 / 编排 / 资产 / CLI 不得出现任何实现名词（词边界匹配）。
    - '! grep -rEinw "gazebo|gz|easygo|docker|ros" internal/contract internal/orchestrator internal/assets internal/cli'
    - go build -o /tmp/simenv ./cmd/simenv
    - go build -o /tmp/simenv-world-gazebo ./cmd/simenv-world-gazebo

world-image:
  stage: image
  image: nexus3.sr/docker:25-git
  tags:
    - docker-cicd
    - docker-builder
  rules:
    - changes:
        - deploy/Dockerfile
        - deploy/assets/**/*
        - cmd/simenv-world-gazebo/**/*
        - internal/ports/world/gazebo/**/*
  script:
    - docker build -f deploy/Dockerfile -t simenv-world-gazebo:ci .

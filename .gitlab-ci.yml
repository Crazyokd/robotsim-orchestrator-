stages:
  - check
  - image

default:
  interruptible: true

go:
  stage: check
  image: golang:1.24-bookworm
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  cache:
    key: go-1.24
    paths:
      - .cache/go-build/
      - .cache/go-mod/
  script:
    - test -z "$(gofmt -l cmd internal)"
    - go test ./...
    - go build -o /tmp/simenv ./cmd/simenv
    - go build -o /tmp/simenv-world ./cmd/simenv-world

world-image:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - go
  rules:
    - changes:
        - deploy/Dockerfile
        - deploy/assets/**/*
        - cmd/simenv-world/**/*
        - internal/contract/**/*
        - internal/world/**/*
  script:
    - docker build -f deploy/Dockerfile -t simenv-world:ci .

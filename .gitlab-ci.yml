stages:
  - lint
  - image

default:
  interruptible: true

lint:
  stage: lint
  image: nexus3.sr/go:latest-bookworm-dev-env-linux-amd64
  tags:
    - docker-cicd
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  cache:
    key: go-1.24
    paths:
      - .cache/go-build/
      - .cache/go-mod/
  script:
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - go test -race ./...
    - go build -o /tmp/simenv ./cmd/simenv
    - go build -o /tmp/simenv-world ./cmd/simenv-world

world-image:
  stage: image
  image: nexus3.sr/docker:25-git
  tags:
    - docker-cicd
    - docker-builder
  rules:
    - changes:
        - deploy/Dockerfile
        - deploy/assets/**/*
        - cmd/simenv-world/**/*
        - internal/contract/**/*
        - internal/world/**/*
  script:
    - docker build -f deploy/Dockerfile -t simenv-world:ci .
